services:
    php:
        build:
            context: .
            dockerfile: Dockerfile
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        depends_on:
            - database

    nginx:
        image: nginx:1.28
        ports:
            - "8000:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php

    database:
        image: postgres:16
        environment:
            POSTGRES_DB: mini_crm
            POSTGRES_USER: app
            POSTGRES_PASSWORD: app_password
        ports:
            - "5432:5432"
        volumes:
            - db_data:/var/lib/postgresql/data

volumes:
    db_data:
